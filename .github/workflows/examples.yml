name: examples
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
env:
  DETECTOR_TAG: v1.5.1
  DETECTOR_SHA256: 3fafc146ab0f9e6c316687ff803d1ee4f7974c439a34311322b72cca8966916d
jobs:
  scenario:
    name: ${{ matrix.kind }} → expect exit ${{ matrix.expect }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: release,         expect: 0}   # tag_matches
          - {kind: tag-before-bump, expect: 1}   # tag_mismatch: the release step should stop here
          - {kind: insufficient,    expect: 2}   # nothing determined: not a pass
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the detector (one file, pinned by hash)
        run: |
          curl -fsSL -o closure_drift.py "https://raw.githubusercontent.com/luizfnsilva/closure_drift/${DETECTOR_TAG}/closure_drift.py"
          echo "${DETECTOR_SHA256}  closure_drift.py" | sha256sum -c -
      - name: Build the scenario
        run: echo "TAG=$(scenarios/make.sh "$RUNNER_TEMP/repo" ${{ matrix.kind }})" >> "$GITHUB_ENV"
      - name: Check the tag
        run: |
          set +e
          python3 closure_drift.py "$RUNNER_TEMP/repo" --tag "$TAG"
          code=$?
          echo "exit $code (expected ${{ matrix.expect }})"
          test "$code" = "${{ matrix.expect }}"
